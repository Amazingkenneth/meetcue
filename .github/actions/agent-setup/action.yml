name: Agent toolchain
description: Installs what an agent needs to build and test MeetCue, matching CI.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        key: agent
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
    - name: Install system libraries
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
          libdbus-1-dev libspeechd-dev libclang-dev libxdo-dev libssl-dev
    - name: Install packages and the placeholder frontend
      shell: bash
      run: |
        npm ci
        mkdir -p app/ui/dist
        [ -f app/ui/dist/index.html ] || echo '<!doctype html>' > app/ui/dist/index.html
