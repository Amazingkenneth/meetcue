name: Docs

on:
  push:
    paths:
      - "docs/**"
      - "crates/core/data/errors.json"
      - "crates/core/data/pricing.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish to GitHub Pages
    # Only the default branch publishes; other branches are checked by CI.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the commit identity
        env:
          GIT_NAME: ${{ vars.GIT_NAME }}
          GIT_EMAIL: ${{ vars.GIT_EMAIL }}
        run: |
          if [ -z "$GIT_NAME" ] || [ -z "$GIT_EMAIL" ]; then
            echo "::error::Set the repository variables GIT_NAME and GIT_EMAIL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          publish_branch: gh-pages
          user_name: ${{ vars.GIT_NAME }}
          user_email: ${{ vars.GIT_EMAIL }}
          full_commit_message: Publish documentation for ${{ github.sha }}
