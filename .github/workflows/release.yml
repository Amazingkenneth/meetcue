name: Release

# Every push to the default branch that changes the app is released once CI
# passes on it: the version is raised, the Windows and macOS builds are published as a
# GitHub release, and the version, changelogs and Scoop manifest are committed
# to the default branch together with a v* tag. Nobody tags by hand.
#
# Markers in a commit's title (for a merge commit, the pull request title),
# so a commit that only mentions them in its description doesn't count:
#   [release minor] / [release major]  raise that part instead of the patch
#   [skip release]                     in the newest commit: don't release it

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise (auto reads the commit markers)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  plan:
    name: Decide the version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          skip() { echo "::notice::No release: $1"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # Only the newest commit is released; an older one's run steps aside
          # and the newer commit's CI run releases both.
          if [ "$EVENT" = workflow_run ] && [ "$TESTED_SHA" != "$sha" ]; then
            skip "the default branch moved on to $sha"
          fi

          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$last" ] && [ "$(git rev-list -n1 "$last")" = "$sha" ]; then
            skip "$sha is already $last"
          fi
          range=${last:+$last..}HEAD
          # A commit's title, or for a GitHub merge commit the pull request
          # title on the first line of its body.
          titles() {
            git log --format='%s%x1f%b%x1e' "$@" | awk -v RS='\x1e' -F '\x1f' '
              NF { sub(/^\n/, ""); print $1
                   if ($1 ~ /^Merge pull request /) { split($2, b, "\n"); print b[1] } }'
          }
          log=$(titles "$range")

          if [ "$EVENT" = workflow_run ]; then
            if grep -qiF '[skip release]' <<<"$(titles -1)"; then
              skip "the newest commit says [skip release]"
            fi
            # Documentation, workflows and the Scoop manifest ship without a release.
            if [ -z "$(git diff --name-only ${last:+"$last"} HEAD -- app crates Cargo.toml Cargo.lock package.json package-lock.json rust-toolchain.toml .cargo)" ]; then
              skip "nothing in the app changed since ${last:-the first commit}"
            fi
          fi

          bump=${BUMP:-auto}
          if [ "$bump" = auto ]; then
            if grep -qiF '[release major]' <<<"$log"; then bump=major
            elif grep -qiF '[release minor]' <<<"$log"; then bump=minor
            else bump=patch
            fi
          fi
          IFS=. read -r major minor patch <<<"${last#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case $bump in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          echo "::notice::Releasing $version ($bump after ${last:-nothing})"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build MeetCue.exe
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: node scripts/set-version.mjs $env:VERSION
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: npm ci

      - name: Build MeetCue.exe
        working-directory: app/src-tauri
        run: npx tauri build --no-bundle

      - name: Check the executable
        run: |
          $out = & target/release/MeetCue.exe --version | Out-String
          Write-Output $out
          if ($out -notmatch [regex]::Escape("MeetCue $env:VERSION")) { throw "unexpected --version output" }

      - name: Pack the portable zip
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "meetcue"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/MeetCue.exe, LICENSE, README.md, README.zh-CN.md -Destination $stage
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath dist-release/meetcue-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: meetcue-win-x64
          path: dist-release/meetcue-win-x64.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: node scripts/set-version.mjs "$VERSION"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-${{ matrix.arch }}
      - run: npm ci
      - name: Build app and disk image
        working-directory: app/src-tauri
        run: npx tauri build --bundles app,dmg
      - name: Verify and pack the app
        run: |
          scripts/check-macos-bundle.sh target/release/bundle/macos/MeetCue.app
          mkdir -p dist-release
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/MeetCue.app "dist-release/meetcue-macos-${{ matrix.arch }}.zip"
          cp target/release/bundle/dmg/*.dmg "dist-release/meetcue-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: meetcue-macos-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Commit, tag and publish
    needs: [plan, build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: meetcue-*
          merge-multiple: true
          path: dist-release

      - name: Commit the version and Scoop manifest, and tag it
        env:
          GIT_NAME: ${{ vars.GIT_NAME }}
          GIT_EMAIL: ${{ vars.GIT_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "$GIT_NAME" ] || [ -z "$GIT_EMAIL" ]; then
            echo "::error::Set the repository variables GIT_NAME and GIT_EMAIL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          # A re-run after the push only needs to finish the release.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG is already pushed"
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout "$TAG"
            exit 0
          fi
          hash=$(sha256sum dist-release/meetcue-win-x64.zip | cut -d' ' -f1)
          node scripts/set-version.mjs "$VERSION" --changelog --hash "$hash"
          node scripts/check-versions.mjs
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git commit -qam "Release $VERSION"
          git tag "$TAG"
          # Both or neither: if the default branch moved since CI passed,
          # nothing is published and the newer commit's run releases it.
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$TAG"

      - name: Create the GitHub release
        run: |
          set -euo pipefail
          {
            echo "Install or update with Scoop: \`scoop install meetcue\` / \`scoop update meetcue\`. See the [installation guide](https://amazingkenneth.github.io/meetcue/install)."
            echo
            # This version's changelog section, without its heading.
            awk -v h="## $VERSION — " 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' docs/reference/changelog.md
            echo
            echo "macOS: download the arm64 (Apple Silicon) or x64 (Intel) disk image, drag MeetCue to Applications, and grant microphone and screen/audio recording access. These builds are ad-hoc signed, not notarized; see the installation guide."
            echo
            sha256sum dist-release/*
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" dist-release/* --verify-tag \
              --title "MeetCue $VERSION" --notes-file notes.md
          fi

      - name: Publish the new changelog to the documentation site
        # Pushes made with GITHUB_TOKEN don't start workflows, so ask for it.
        run: gh workflow run docs.yml --ref "$DEFAULT_BRANCH"

  scoop:
    name: Install with Scoop
    needs: [plan, publish]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.plan.outputs.version }}
      - name: Install the released manifest and check the version
        run: |
          # The runner account is an administrator, which Scoop's installer refuses without -RunAsAdmin.
          Invoke-RestMethod get.scoop.sh -OutFile install.ps1
          .\install.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop install .\bucket\meetcue.json
          if ($LASTEXITCODE -ne 0) { throw "scoop install failed" }
          $exe = "$env:USERPROFILE\scoop\apps\meetcue\current\MeetCue.exe"
          $out = & $exe --version | Out-String
          Write-Output $out
          if ($out -notmatch [regex]::Escape("MeetCue $env:VERSION")) { throw "installed MeetCue reports the wrong version" }
