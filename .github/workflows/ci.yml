name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (core, pipeline, audio, platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev libspeechd-dev libclang-dev libxdo-dev libssl-dev
      - name: Placeholder frontend for the Tauri macros
        run: mkdir -p app/ui/dist && echo '<!doctype html>' > app/ui/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude meetcue-app
      - name: Generated TypeScript bindings are up to date
        run: git diff --exit-code -- app/ui/src/bindings app/ui/src/mock/default-settings.json

  ui:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-locales.mjs
      - run: node scripts/check-versions.mjs

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm run docs:lint

  app:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev libspeechd-dev libclang-dev libxdo-dev libssl-dev
      - run: npm ci
      - name: Build the Windows executable
        if: runner.os == 'Windows'
        run: npx tauri build --no-bundle
        working-directory: app/src-tauri
      - name: Check the executable runs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = & target/release/MeetCue.exe --version | Out-String
          Write-Output $out
          if ($out -notmatch 'MeetCue \d+\.\d+\.\d+') { throw "unexpected --version output" }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: MeetCue-windows-x64
          path: target/release/MeetCue.exe
          retention-days: 14
      - name: Build (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          npm run build
          cargo build -p meetcue-app
      - run: cargo test -p meetcue-app

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan history and working tree
        run: |
          ./gitleaks git --redact --no-banner -v .
          ./gitleaks dir --redact --no-banner -v .
