name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (core, pipeline, audio, platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: Install system libraries
        timeout-minutes: 20
        run: |
          # The downloaded packages are cached (see above): the Ubuntu mirror is
          # sometimes slow enough to time this step out.
          mkdir -p ~/apt-cache/partial
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-cache" install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev libspeechd-dev libclang-dev libxdo-dev libssl-dev
          sudo chown -R "$USER" ~/apt-cache
      - name: Placeholder frontend for the Tauri macros
        run: mkdir -p app/ui/dist && echo '<!doctype html>' > app/ui/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude meetcue-app
      - name: Generated TypeScript bindings are up to date
        run: git diff --exit-code -- app/ui/src/bindings app/ui/src/mock/default-settings.json

  ui:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-locales.mjs
      - run: node scripts/check-versions.mjs

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm run docs:lint

  app:
    name: Desktop app (${{ matrix.os }})
    env:
      APPLE_SIGNING_IDENTITY: '-'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: Install system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          # The downloaded packages are cached (see above): the Ubuntu mirror is
          # sometimes slow enough to time this step out.
          mkdir -p ~/apt-cache/partial
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-cache" install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev libspeechd-dev libclang-dev libxdo-dev libssl-dev
          sudo chown -R "$USER" ~/apt-cache
      - run: npm ci
      - name: Build the Windows executable
        if: runner.os == 'Windows'
        run: npx tauri build --no-bundle
        working-directory: app/src-tauri
      - name: Check the executable runs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = & target/release/MeetCue.exe --version | Out-String
          Write-Output $out
          if ($out -notmatch 'MeetCue \d+\.\d+\.\d+') { throw "unexpected --version output" }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: MeetCue-windows-x64
          path: target/release/MeetCue.exe
          retention-days: 14
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          npm run build
          cargo build -p meetcue-app
      - name: Test the native macOS audio bridge
        if: runner.os == 'macOS'
        run: |
          cargo clippy -p meetcue-audio --all-targets -- -D warnings
          cargo test -p meetcue-audio
      - name: Build and verify the macOS app bundle
        if: runner.os == 'macOS'
        working-directory: app/src-tauri
        run: |
          npx tauri build --bundles app
          ../../scripts/check-macos-bundle.sh ../../target/release/bundle/macos/MeetCue.app
      - name: Pack the macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/MeetCue.app MeetCue-macos-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: MeetCue-macos-${{ runner.arch }}
          path: MeetCue-macos-${{ runner.arch }}.zip
          retention-days: 14
      - run: cargo test -p meetcue-app

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan history and working tree
        run: |
          ./gitleaks git --redact --no-banner -v .
          ./gitleaks dir --redact --no-banner -v .
