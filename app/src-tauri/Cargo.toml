[package]
name = "meetcue-app"
description = "MeetCue desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "MeetCue"

[[bin]]
name = "MeetCue"
path = "src/main.rs"

[lib]
name = "meetcue_app"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
meetcue-core.workspace = true
meetcue-pipeline.workspace = true
meetcue-audio.workspace = true
meetcue-platform.workspace = true
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
